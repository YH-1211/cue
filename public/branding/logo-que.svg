<!--
  Que ロゴ / ワードマーク版（カバー・リッチメニュー等の横長用）
  書体は Q 一文字版と同じ SF Pro Display / weight 800（線の太さを揃えるため）。
  オレンジのドットは文字の高さ H に対する比率で配置している:
    cx = 文字の右端 + 0.10H / cy = 文字の上端 + 0.00H / r = 0.12H
  文字 bbox: x 322〜767 / y 257〜443 (H=186)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="280 200 560 300">
  <rect x="280" y="200" width="560" height="300" fill="#0A0A0F"/>
  <text x="540" y="430" font-family="'SF Pro Display', system-ui, sans-serif" font-size="240" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-10">Que</text>
  <circle cx="785.6" cy="257" r="22.3" fill="#F97316"/>
</svg>
